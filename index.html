<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yanyu Chen — Robotics Engineering student working across mechanical design, embedded firmware, and robotics software."
    />
    <meta name="theme-color" content="#E8E9E4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)" />

    <!--
      Share card. A large share of first views arrive as a link in a message, and
      without these the page previewed as a bare grey URL — no title, no image.
      Absolute URLs are required: every scraper fetches these without a base.

      og.png is generated from the real hero by scripts/og.html — see
      docs/CONTENT.md#the-share-card. Regenerate it whenever the hero or the
      title block changes, or the card will advertise last month's facts.
    -->
    <link rel="canonical" href="https://yanyu-chen.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yanyu-chen.com/" />
    <meta property="og:site_name" content="Yanyu Chen" />
    <meta property="og:title" content="Yanyu Chen — Robotics Engineering" />
    <meta
      property="og:description"
      content="Robotics Engineering student working across mechanical design, embedded firmware, and robotics software."
    />
    <meta property="og:image" content="https://yanyu-chen.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yanyu Chen — Robotics Engineering" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Yanyu Chen — Robotics Engineering</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
